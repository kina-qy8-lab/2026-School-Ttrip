<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>修学旅行 プログラム選択</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1c2330; --sub:#5b6472;
    --line:#e3e7ee; --brand:#2f80ed; --brand-d:#1f63c4;
    --ok:#2b9d6e; --warn:#e07a3c; --bad:#d2453f; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .bar{max-width:920px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
  .bar h1{font-size:16px;margin:0;font-weight:700}
  .who{margin-left:auto;font-size:13px;color:var(--sub);text-align:right}
  main{max-width:920px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .btn{appearance:none;border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-d)}
  .btn-ghost{background:#eef1f6;color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .muted{color:var(--sub);font-size:13px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill-ok{background:#e6f6ee;color:var(--ok)}
  .pill-warn{background:#fdf0e6;color:var(--warn)}
  .pill-bad{background:#fbe9e8;color:var(--bad)}
  .pill-info{background:#e9f1fd;color:var(--brand-d)}
  .plist{display:grid;gap:12px}
  .prog{border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;transition:border-color .12s}
  .prog:hover{border-color:#c9d4e6}
  .prog.sel{border-color:var(--brand);box-shadow:0 0 0 2px #2f80ed22}
  .prog.full{opacity:.55;cursor:not-allowed}
  .prog .row{display:flex;gap:12px;padding:12px}
  .prog img{width:96px;height:72px;object-fit:cover;border-radius:8px;background:#eef1f6;flex:none}
  .prog .ttl{font-weight:700;font-size:15px}
  .prog .meta{font-size:12px;color:var(--sub);margin-top:2px}
  .prog .desc{font-size:13px;color:var(--sub);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .count{font-size:12px;font-weight:700}
  .center{text-align:center;padding:40px 16px}
  .err{color:var(--bad);font-size:14px}
  .sticky-actions{position:sticky;bottom:0;background:linear-gradient(#fff0,#fff 30%);padding:14px 0 4px;display:flex;gap:10px;justify-content:flex-end}
  .big{font-size:20px;font-weight:800}
  .deadline{font-size:13px;color:var(--warn);font-weight:600}
</style>
</head>
<body>
<header><div class="bar">
  <h1>修学旅行 プログラム選択</h1>
  <div class="who" id="who"></div>
</div></header>
<main id="app"><div class="center muted">読み込み中…</div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection, query, where,
  orderBy, getCountFromServer, serverTimestamp, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $app = document.getElementById('app');
const $who = document.getElementById('who');

const ROUND_LABEL = { round1:"第一次抽選", round2:"第二次抽選", final:"最終抽選" };

let state = { user:null, student:null, programs:[], config:null, application:null, result:null, counts:{} };

// ---------- 認証 ----------
onAuthStateChanged(auth, async (user) => {
  if (!user) { renderLogin(); return; }
  state.user = user;
  $who.innerHTML = `${esc(user.displayName||user.email)}<br><a href="#" id="lo">ログアウト</a>`;
  document.getElementById('lo').onclick = (e)=>{e.preventDefault();signOut(auth);};
  await loadAll();
});

function renderLogin(){
  $who.textContent = "";
  $app.innerHTML = `<div class="card center">
    <p class="big">ようこそ</p>
    <p class="muted">学校から配布された Google アカウントでログインしてください。</p>
    <button class="btn btn-primary" id="gl">Google でログイン</button>
    <p class="err" id="loginerr"></p>
  </div>`;
  document.getElementById('gl').onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ document.getElementById('loginerr').textContent = "ログインに失敗しました: "+e.message; }
  };
}

// ---------- データ取得 ----------
async function loadAll(){
  $app.innerHTML = `<div class="center muted">読み込み中…</div>`;
  const email = state.user.email;
  try {
    const sSnap = await getDoc(doc(db,'students',email));
    if (!sSnap.exists()){
      $app.innerHTML = `<div class="card center">
        <p class="big">未登録のアカウントです</p>
        <p class="muted">このアカウントは名簿に登録されていません。先生に確認してください。</p>
        <button class="btn btn-ghost" id="so">別アカウントでログイン</button>
      </div>`;
      document.getElementById('so').onclick = ()=>signOut(auth);
      return;
    }
    state.student = { id:email, ...sSnap.data() };

    const cfgSnap = await getDoc(doc(db,'config','lottery'));
    state.config = cfgSnap.exists() ? cfgSnap.data() : null;

    const pSnap = await getDocs(query(collection(db,'programs'), orderBy('order')));
    state.programs = pSnap.docs.map(d=>({id:d.id, ...d.data()}));

    const aSnap = await getDoc(doc(db,'applications',email));
    state.application = aSnap.exists() ? aSnap.data() : null;

    const rSnap = await getDoc(doc(db,'results',email));
    state.result = rSnap.exists() ? rSnap.data() : null;

    await loadCounts();
    renderDashboard();
  } catch(e){
    $app.innerHTML = `<div class="card"><p class="err">読み込みエラー: ${esc(e.message)}</p>
      <button class="btn btn-ghost" id="rt">再読み込み</button></div>`;
    document.getElementById('rt').onclick = loadAll;
  }
}

async function loadCounts(){
  // 現在の回の申込人数を各プログラムごとに集計（集計クエリ＝読み取り少）
  state.counts = {};
  const round = state.config?.currentRound || 'round1';
  for (const p of state.programs){
    try{
      const cs = await getCountFromServer(query(collection(db,'applications'),
        where('programId','==',p.id), where('round','==',round)));
      state.counts[p.id] = cs.data().count;
    }catch{ state.counts[p.id] = null; }
  }
}

// ---------- 画面 ----------
function renderDashboard(){
  const cfg = state.config;
  const r = state.result;

  // 1) 確定済み
  if (r && r.status === 'confirmed'){
    const prog = state.programs.find(p=>p.id===r.programId);
    $app.innerHTML = `
      <div class="card center">
        <span class="pill pill-ok">参加プログラム確定</span>
        <p class="big" style="margin:14px 0 4px">${esc(prog?.name||'(不明)')}</p>
        <p class="muted">${ROUND_LABEL[r.round]||''}で決定しました。</p>
      </div>
      ${prog ? progCardStatic(prog) : ''}`;
    return;
  }

  if (!cfg){
    $app.innerHTML = `<div class="card center muted">抽選日程がまだ設定されていません。先生からの案内をお待ちください。</div>`;
    return;
  }

  const round = cfg.currentRound;            // 現在受付中の回
  const roundDone = cfg[round+'Done'];       // その回の抽選が実行済みか
  const deadline = cfg[round+'At'];          // 締切 Timestamp

  // 2) この回の抽選が実行済み（＝自分は今のところ落選 or 未処理）→ 結果待ち or 次回案内
  if (roundDone){
    const lostHere = r && r.status==='lost' && r.round===round;
    $app.innerHTML = `<div class="card center">
      <span class="pill pill-warn">抽選結果</span>
      <p class="big" style="margin:14px 0 6px">${lostHere ? 'このプログラムは抽選で外れました' : '今回は当選しませんでした'}</p>
      <p class="muted">次の抽選の受付開始までお待ちください。受付が始まったら、このページから再度申し込めます。</p>
      <button class="btn btn-ghost" id="rl">最新の状態に更新</button>
    </div>`;
    document.getElementById('rl').onclick = loadAll;
    return;
  }

  // 3) 受付中：申込／修正 UI
  renderApply(round, deadline);
}

function renderApply(round, deadline){
  const myPid = state.application && state.application.round===round ? state.application.programId : null;
  const isModify = !!myPid;
  const lostBefore = state.result && state.result.status==='lost';
  const dl = deadline ? fmt(deadline) : '未設定';

  const list = state.programs.map(p=>{
    const cnt = state.counts[p.id];
    const full = (round!=='round1') && typeof cnt==='number' && cnt>=p.capacity; // 2回目以降は満員に申込不可
    const sel = p.id===myPid;
    const cntTxt = cnt==null ? '—' : `${cnt} / ${p.capacity} 名`;
    const cntCls = (typeof cnt==='number' && cnt>=p.capacity) ? 'pill-bad' : 'pill-info';
    return `<div class="prog ${sel?'sel':''} ${full?'full':''}" data-id="${esc(p.id)}">
      <div class="row">
        ${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="">`:`<div style="width:96px;height:72px;border-radius:8px;background:#eef1f6;flex:none"></div>`}
        <div>
          <div class="ttl">${esc(p.name)}</div>
          <div class="meta"><span class="pill ${cntCls}">申込 ${cntTxt}</span> ${full?'<span class="pill pill-bad">満員・募集終了</span>':''}</div>
          <div class="desc">${esc(p.description||'')}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  $app.innerHTML = `
    <div class="card">
      <span class="pill pill-info">${ROUND_LABEL[round]||''} 受付中</span>
      <span class="deadline" style="margin-left:8px">締切: ${esc(dl)}</span>
      <p class="muted" style="margin:10px 0 0">
        ${isModify ? '現在の申込内容を表示しています。締切までは何度でも修正できます。'
                   : (lostBefore ? '前回は抽選で外れました。空きのあるプログラムから申し込んでください。'
                                 : '参加したいプログラムを1つ選んで申し込んでください。')}
      </p>
    </div>
    <div class="card">
      <div class="plist" id="plist">${list}</div>
      <div class="sticky-actions">
        <span class="muted" id="selinfo" style="margin-right:auto;align-self:center"></span>
        <button class="btn btn-primary" id="submit" disabled>${isModify?'修正する':'申し込む'}</button>
      </div>
      <p class="err" id="apperr"></p>
    </div>`;

  let chosen = myPid;
  const $submit = document.getElementById('submit');
  const $info = document.getElementById('selinfo');
  function refresh(){
    document.querySelectorAll('.prog').forEach(el=>{
      el.classList.toggle('sel', el.dataset.id===chosen);
    });
    const p = state.programs.find(x=>x.id===chosen);
    const unchanged = isModify && chosen===myPid;
    $submit.disabled = !chosen || unchanged;
    $info.textContent = p ? (`選択中: ${p.name}` + (unchanged?'（変更なし）':'')) : '';
  }
  document.querySelectorAll('.prog').forEach(el=>{
    el.onclick = ()=>{
      if (el.classList.contains('full')) return;
      chosen = el.dataset.id; refresh();
    };
  });
  refresh();

  $submit.onclick = async ()=>{
    if(!chosen) return;
    $submit.disabled=true; $submit.textContent='送信中…';
    try{
      // 締切チェック（クライアント側）
      if (deadline && deadline.toMillis && Date.now() > deadline.toMillis()){
        throw new Error('締切を過ぎています。');
      }
      await setDoc(doc(db,'applications',state.user.email),{
        studentEmail: state.user.email,
        programId: chosen,
        round,
        updatedAt: serverTimestamp(),
      });
      await loadAll();
    }catch(e){
      document.getElementById('apperr').textContent = '送信に失敗しました: '+e.message;
      $submit.disabled=false; $submit.textContent=isModify?'修正する':'申し込む';
    }
  };
}

function progCardStatic(p){
  return `<div class="card"><div class="prog"><div class="row">
    ${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="">`:''}
    <div><div class="ttl">${esc(p.name)}</div><div class="desc">${esc(p.description||'')}</div></div>
  </div></div></div>`;
}

// ---------- utils ----------
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(ts){ try{const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return '';} }
</script>
</body>
</html>
